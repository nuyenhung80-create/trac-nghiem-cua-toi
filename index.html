     +'<h3>Chọn nền có sẵn</h3><div class="sw">'+PRE.map((q,i)=>'<button data-p="'+i+'" style="--sw:'+q[1]+';--sz:'+q[2]+';color:'+(q[3]?'#fff':'#172033')+'" class="'+(!img&&S.p===i?"on":"")+'">'+q[0]+'</button>').join("")+'</div>'
     +'<h3>Dùng ảnh của bạn</h3><div class="chips"><button id="bgpick">Chọn ảnh từ máy</button>'+(img?'<button class="secondary" id="bgdel">Bỏ ảnh</button>':'')+'</div><input type="file" id="bgfile" accept="image/*" style="display:none"><div id="bgmsg" class="hint" style="margin-top:6px"></div>'
     +(img?'<h3>Cách đặt ảnh</h3><div class="chips">'+[["cover","Phủ kín màn hình"],["contain","Hiện đủ cả ảnh"],["fill","Giãn vừa khung"]].map(f=>'<button class="secondary '+(S.fit===f[0]?"on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>').join("")+'</div>':'')
     +'<h3>Chỉnh cho đẹp</h3>'+SL.map(r=>'<div class="sl"><label><span>'+r[1]+'</span><b id="v_'+r[0]+'"></b></label><input type="range" data-k="'+r[0]+'" min="'+r[2]+'" max="'+r[3]+'">'+(r[4]?'<small>'+r[4]+'</small>':'')+'</div>').join("")
     +'<div class="chips" style="margin-top:14px"><button class="secondary" id="bgreset">↺ Cân đối lại như ban đầu</button></div></div>';
    panel.querySelectorAll("input[type=range]").forEach(r=>{
      const k=r.dataset.k, v=panel.querySelector("#v_"+k); r.value=S[k]; v.textContent=S[k];
      r.oninput=()=>{ S[k]=+r.value; v.textContent=r.value; apply(); save(); };
    });
    panel.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ S.p=+b.dataset.p; img=""; try{localStorage.removeItem(IK);}catch(e){} save(); apply(); build(); });
    panel.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{ S.th=b.dataset.th; save(); apply(); build(); });
    panel.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ S.fit=b.dataset.f; save(); apply(); build(); });
    const bd=panel.querySelector("#bgdel"); if(bd) bd.onclick=()=>{ img=""; try{localStorage.removeItem(IK);}catch(e){} apply(); build(); };
    panel.querySelector("#bgreset").onclick=()=>{ const p=S.p, th=S.th; S=Object.assign({},DEF,{p,th}); save(); apply(); build(); };
    panel.querySelector("#bgx").onclick=()=>panel.classList.remove("on");
    const f=panel.querySelector("#bgfile"); panel.querySelector("#bgpick").onclick=()=>f.click();
    f.onchange=e=>{
      const file=e.target.files[0]; if(!file) return;
      const fr=new FileReader();
      fr.onload=()=>{ const im=new Image(); im.onload=()=>{
        const sc=Math.min(1,1600/Math.max(im.width,im.height)), cv=document.createElement("canvas");
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        img=cv.toDataURL("image/jpeg",0.82); imgLum=lumOf(cv);
        let ok=true; try{ localStorage.setItem(IK,img); }catch(err){ ok=false; }
        apply(); build();
        if(!ok) panel.querySelector("#bgmsg").textContent="Ảnh dùng được lúc này nhưng máy không đủ chỗ nhớ nên lần mở sau sẽ mất. Hãy chọn ảnh nhỏ hơn.";
      }; im.src=fr.result; };
      fr.readAsDataURL(file);
    };
  }
  const gearBtn=document.getElementById("gear");
  gearBtn.onclick=()=>{ if(panel.classList.contains("on")){ panel.classList.remove("on"); } else { build(); panel.classList.add("on"); } };
  new MutationObserver(()=>{ gearBtn.classList.toggle("open",panel.classList.contains("on")); }).observe(panel,{attributes:true,attributeFilter:["class"]});
  panel.addEventListener("click",e=>{ if(e.target===panel) panel.classList.remove("on"); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") panel.classList.remove("on"); });
})();

<script>
(function(){

  const PRICE=/*PAY_PRICE*/25000/*END_PRICE*/;

  const K="tracnghiem_lic_v1", DK="tracnghiem_dev_v1", AB="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let dev="";
  try{ dev=localStorage.getItem(DK)||""; }catch(e){}
  if(!/^[A-Z0-9]{8}$/.test(dev)){
    const r=crypto.getRandomValues(new Uint8Array(8)); dev=Array.from(r,x=>AB[x%AB.length]).join("");
    try{ localStorage.setItem(DK,dev); }catch(e){}

  const u8=t=>{ t=t.replace(/-/g,"+").replace(/_/g,"/"); t+="=".repeat((4-t.length%4)%4); return Uint8Array.from(atob(t),c=>c.charCodeAt(0)); };
  const CK="tracnghiem_clock_v1"; let expiredNote=false;
  function clockBad(){
    let l=0; try{ l=+localStorage.getItem(CK)||0; }catch(e){}
    const now=Date.now(); if(now<l-300000) return true;

  async function check(code){
    try{
      const parts=code.replace(/\s+/g,"").split(".");

      const payload=u8(parts[0]), sig=u8(parts[1]);
      const key=await crypto.subtle.importKey("jwk",PUB,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
      if(!(await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,sig,payload))) return null;
      const o=JSON.parse(new TextDecoder().decode(payload));
      if(o.d!==dev) return null;
      if(o.x && (clockBad() || Date.now()>=o.x)){ expiredNote=true; return null; }
      return { n:o.n||"Người dùng", x:o.x||0 };
    }catch(e){ return null; }
  }
  async function isRevoked(){
    if(!PAY_API) return false;
    try{ const j=await (await fetch(PAY_API+"/status?d="+dev,{cache:"no-store"})).json(); return !!j.revoked; }catch(e){ return false; }
  }
  function watch(){
    if(!PAY_API) return;
    const chk=async()=>{ if(await isRevoked()){ try{ localStorage.removeItem(K); }catch(e){} location.reload(); } };
    setInterval(chk,600000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) chk(); });

  const money=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".")+"đ";

      a.style.cssText="position:fixed;top:0;left:0;opacity:0;font-size:16px;";

    '<h1 class="g-title">Mở khóa app trọn đời</h1>'

   +'<div id="licMsg" class="g-msg"></div><button id="licGo" class="secondary g-full">Kích hoạt</button></details>'
   +'<div class="g-ver">Phiên bản kích hoạt 5</div></div>';
  document.body.appendChild(ov);
  let timer=null, stopped=false;
  const note=t=>{ const n=ov.querySelector("#licNote"); n.textContent=t; n.style.display="block"; };
  const fmt=ms=>{ const m=Math.ceil(ms/60000); return m>=1440?Math.floor(m/1440)+" ngày "+Math.floor(m%1440/60)+" giờ":m>=60?Math.floor(m/60)+" giờ "+m%60+" phút":m+" phút"; };
  function unlock(info){
    const name=info.n;
    stopped=true; clearTimeout(timer);
    ov.remove();
    const w=document.createElement("div");
    const svg="<svg xmlns='http://www.w3.org/2000/svg' width='260' height='170'><text x='20' y='110' fill='%23808080' fill-opacity='.12' font-size='15' font-family='sans-serif' transform='rotate(-24 130 85)'>"+name.replace(/[<>&'"]/g,"")+"</text></svg>";
    w.style.cssText="position:fixed;inset:0;z-index:45;pointer-events:none;background:url(\"data:image/svg+xml,"+encodeURIComponent(svg)+"\")";

    }

    wb.innerHTML='<svg class="ic-on" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="ic-off" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg>';
    let wmOn=true; try{ wmOn=localStorage.getItem(WK)!=="0"; }catch(e){}
    const wmApply=()=>{ w.style.display=wmOn?"":"none"; if(!info.x) t.style.display=wmOn?"":"none"; wb.classList.toggle("off",!wmOn); };

      wmOn=!wmOn; try{ localStorage.setItem(WK,wmOn?"1":"0"); }catch(e){}

  const msg=ov.querySelector("#licMsg"), inp=ov.querySelector("#licIn");
  async function tryCode(code){
    if(!(window.crypto&&crypto.subtle)){ msg.textContent="Hãy mở app bằng Safari hoặc Chrome qua đường link web."; return false; }

    unlock(info); return true;

  ov.querySelector("#licGo").onclick=()=>tryCode(inp.value);
  ov.querySelector("#licPaste").onclick=async()=>{
    try{ const t=await navigator.clipboard.readText(); inp.value=t; tryCode(t); }
    catch(e){ msg.textContent="Máy chưa cho đọc bộ nhớ copy. Hãy dán mã vào ô bên dưới rồi bấm Kích hoạt."; }
  };
  ov.querySelector("#licShare").onclick=async()=>{
    const t="Mình muốn mua app Trắc nghiệm. Mã máy của mình: "+devShow;
    if(await copyText(t)){ msg.style.color="var(--ok)"; msg.textContent="Đã sao chép. Hãy dán và gửi cho người bán."; }

    }
    ov.querySelector("#payChk").onclick=()=>{ tell("Đang kiểm tra…"); poll(true); };
    let cnt=0;
    const loop=()=>{ if(stopped) return; timer=setTimeout(async()=>{ await poll(); cnt++; loop(); }, cnt<300?2000:10000); };

    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
  }
  let saved=""; try{ saved=localStorage.getItem(K)||""; }catch(e){}
  if(saved && window.crypto && crypto.subtle) check(saved).then(n=>{ if(n) unlock(n); else if(expiredNote) note("Thời gian dùng thử đã hết. Hãy mở khóa trọn đời để tiếp tục dùng."); });
})();
