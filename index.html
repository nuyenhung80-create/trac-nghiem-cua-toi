<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm</title>
<style>
  :root{
    --bg:#0b0b0d; --card:#171013; --text:#f5ecd8; --muted:#c9a15a;
    --accent:#c1121f; --accent-2:#ffb703; --ok:#43a047; --bad:#ff5252;
    --border: rgba(255,183,3,0.25);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; position:relative; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; bottom:-70px; right:-70px; width:240px; height:240px;
    border-radius:50%; background:radial-gradient(circle, #8fe6ff 0%, #1fb6ff 32%, transparent 70%);
    filter:blur(4px); opacity:.28; z-index:0; pointer-events:none;
  }
  body::after{
    content:""; position:fixed; top:-90px; left:-90px; width:260px; height:260px;
    border-radius:50%; background:radial-gradient(circle, var(--accent) 0%, transparent 65%);
    opacity:.18; z-index:0; pointer-events:none;
  }
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px;position:relative;z-index:1;}
  h1{font-size:1.4rem;margin:0 0 4px;color:var(--accent-2);text-shadow:0 0 14px rgba(255,183,3,.35);}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.35);}
  textarea{
    width:100%;min-height:150px;border-radius:10px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--text);padding:10px;font-size:.9rem;font-family:inherit;resize:vertical;
  }
  button{
    background:linear-gradient(135deg, var(--accent), #7a0000);color:#fff8ea;border:none;border-radius:10px;
    padding:10px 16px;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 0 10px rgba(193,18,31,.35);
  }
  button.secondary{background:transparent;color:var(--accent-2);border:1px solid var(--accent-2);box-shadow:none;}
  button:disabled{opacity:.5;cursor:default;box-shadow:none;}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  .q-num{color:var(--muted);font-size:.8rem;margin-bottom:6px;}
  .q-text{font-weight:600;margin-bottom:12px;}
  .opt{
    display:block;width:100%;text-align:left;border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.02);color:var(--text);
    font-size:.9rem;cursor:pointer;
  }
  .opt.selected{border-color:var(--accent-2);background:rgba(255,183,3,.14);}
  .opt.correct{border-color:var(--ok);background:rgba(67,160,71,.18);}
  .opt.wrong{border-color:var(--bad);background:rgba(255,82,82,.18);}
  .opt.key{border-color:var(--accent-2);background:rgba(255,183,3,.28);box-shadow:0 0 12px rgba(255,183,3,.35);border-width:2px;}
  .opt.correct{border-width:2px;}
  .opt.wrong{border-width:2px;}
  .opt.result-dim{opacity:.35;filter:grayscale(.4);}
  button.opt:disabled{opacity:1;cursor:default;}
  .opt-tag{
    display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;
    font-size:.75rem;font-weight:800;vertical-align:middle;letter-spacing:.02em;
  }
  .opt-tag.tag-ok{background:#2e7d32;color:#fff;border:none;}
  .opt-tag.tag-bad{background:#c62828;color:#fff;border:none;}
  .opt-tag.tag-key{background:#f9a825;color:#1a1200;border:none;}
  .result-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;
    font-size:.9rem;font-weight:800;margin-bottom:12px;
  }
  .result-badge.ok{background:rgba(67,160,71,.28);color:var(--ok);border:1px solid #43a047;}
  .result-badge.bad{background:rgba(255,82,82,.28);color:var(--bad);border:1px solid #ff5252;}
  .result-compare{
    display:flex;flex-direction:column;gap:10px;margin:0 0 14px;padding:14px;
    border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--border);
  }
  .result-compare .rc-row{
    display:flex;align-items:flex-start;gap:12px;font-size:.95rem;line-height:1.5;
  }
  .result-compare .rc-label{
    flex:0 0 auto;min-width:108px;padding:5px 10px;border-radius:8px;
    font-size:.78rem;font-weight:800;text-align:center;margin-top:0;letter-spacing:.02em;
  }
  .rc-label.bad{background:#c62828;color:#fff;box-shadow:0 0 10px rgba(198,40,40,.35);}
  .rc-label.key{background:#f9a825;color:#1a1200;box-shadow:0 0 10px rgba(249,168,37,.35);}
  .rc-label.ok{background:#2e7d32;color:#fff;box-shadow:0 0 10px rgba(46,125,50,.35);}
  .result-compare .rc-text{flex:1;font-weight:700;font-size:1rem;}
  .result-legend{
    display:flex;flex-wrap:wrap;gap:10px 18px;font-size:.85rem;margin:12px 0 10px;color:var(--muted);
    padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);
  }
  .result-legend span{display:inline-flex;align-items:center;gap:6px;}
  .lg-dot{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid transparent;}
  .lg-dot.ok{background:rgba(67,160,71,.85);border-color:#43a047;}
  .lg-dot.bad{background:rgba(255,82,82,.85);border-color:#ff5252;}
  .lg-dot.key{background:rgba(255,183,3,.9);border-color:#ffb703;}
  .result-badge{font-size:1rem;padding:8px 16px;}
  .opt .opt-tag{margin-left:10px;font-size:.8rem;padding:4px 12px;}
  .quiz-reactor-wrap{display:flex;align-items:center;gap:8px;}
  .arc-reactor.sm{width:30px;height:30px;}
  .arc-reactor.sm::before{inset:5px;border-width:1.5px;}
  .arc-reactor.sm::after{inset:10px;}
  /* Khi làm bài: xoay rõ + sáng mạnh */
  .arc-reactor.spinning{
    animation: arc-pulse 0.85s ease-in-out infinite, arc-flicker 0.08s steps(2) infinite;
    box-shadow:
      0 0 10px 3px rgba(180,240,255,1),
      0 0 28px 10px rgba(31,182,255,.8),
      0 0 50px 16px rgba(31,182,255,.45),
      inset 0 0 12px rgba(255,255,255,.5);
  }
  .arc-reactor.spinning .arc-spokes{animation: arc-spin 0.85s linear infinite;}
  .arc-reactor.spinning::before{animation: arc-ring 0.7s linear infinite;}
  .arc-reactor.spinning::after{animation: arc-core 0.55s ease-in-out infinite alternate;}

  /* ===== JARVIS Arc Reactor ===== */
  .logo-row{display:flex;align-items:center;gap:12px;margin:0 0 4px;}
  .logo-title{font-size:1.4rem;margin:0;color:var(--accent-2);text-shadow:0 0 14px rgba(255,183,3,.35);letter-spacing:.04em;}
  .arc-reactor{
    width:42px;height:42px;position:relative;flex-shrink:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #7ee8ff 0%, #1fb6ff 28%, #0a3a5c 58%, #061018 100%);
    box-shadow:
      0 0 6px 2px rgba(127,232,255,.9),
      0 0 18px 6px rgba(31,182,255,.55),
      0 0 36px 10px rgba(31,182,255,.25),
      inset 0 0 8px rgba(255,255,255,.35);
    animation: arc-pulse 1.6s ease-in-out infinite, arc-flicker 0.12s steps(2) infinite;
  }
  .arc-reactor::before{
    content:"";position:absolute;inset:7px;border-radius:50%;
    border:2px solid rgba(180,240,255,.85);
    box-shadow:0 0 6px rgba(127,232,255,.7), inset 0 0 4px rgba(127,232,255,.4);
    /* trang chủ: chỉ sáng, không xoay */
    animation: none;
  }
  .arc-reactor::after{
    content:"";position:absolute;inset:14px;border-radius:50%;
    background:radial-gradient(circle, #e8fbff 0%, #7ee8ff 40%, #1a8fd0 100%);
    box-shadow:0 0 10px 3px rgba(180,240,255,.9);
    animation: arc-core 1.1s ease-in-out infinite alternate;
  }
  .arc-reactor .arc-spokes{
    position:absolute;inset:0;border-radius:50%;
    background:
      conic-gradient(from 0deg,
        transparent 0deg 18deg, rgba(180,240,255,.55) 18deg 28deg,
        transparent 28deg 48deg, rgba(180,240,255,.55) 48deg 58deg,
        transparent 58deg 78deg, rgba(180,240,255,.55) 78deg 88deg,
        transparent 88deg 108deg, rgba(180,240,255,.55) 108deg 118deg,
        transparent 118deg 138deg, rgba(180,240,255,.55) 138deg 148deg,
        transparent 148deg 168deg, rgba(180,240,255,.55) 168deg 178deg,
        transparent 178deg 198deg, rgba(180,240,255,.55) 198deg 208deg,
        transparent 208deg 228deg, rgba(180,240,255,.55) 228deg 238deg,
        transparent 238deg 258deg, rgba(180,240,255,.55) 258deg 268deg,
        transparent 268deg 288deg, rgba(180,240,255,.55) 288deg 298deg,
        transparent 298deg 318deg, rgba(180,240,255,.55) 318deg 328deg,
        transparent 328deg 360deg);
    mask:radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 64%);
    -webkit-mask:radial-gradient(circle, transparent 38%, #000 40%, #000 62%, transparent 64%);
    /* trang chủ: spokes đứng yên */
    animation: none;
  }
  @keyframes arc-pulse{
    0%,100%{box-shadow:0 0 6px 2px rgba(127,232,255,.85),0 0 16px 5px rgba(31,182,255,.5),0 0 32px 8px rgba(31,182,255,.22),inset 0 0 8px rgba(255,255,255,.3);}
    50%{box-shadow:0 0 10px 4px rgba(180,240,255,1),0 0 28px 12px rgba(31,182,255,.75),0 0 48px 16px rgba(31,182,255,.4),inset 0 0 12px rgba(255,255,255,.5);}
  }
  @keyframes arc-flicker{
    0%,100%{opacity:1;filter:brightness(1);}
    50%{opacity:.88;filter:brightness(1.25);}
  }
  @keyframes arc-core{
    from{transform:scale(.92);opacity:.85;}
    to{transform:scale(1.08);opacity:1;}
  }
  @keyframes arc-ring{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes arc-spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(-360deg);}
  }
  .progress{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress > div{height:100%;background:linear-gradient(90deg, var(--accent), var(--accent-2));transition:width .2s;}
  .score{font-size:2rem;font-weight:700;text-align:center;margin:10px 0;color:var(--accent-2);}
  .hint{color:var(--muted);font-size:.8rem;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  a.link-btn{color:var(--accent-2);font-size:.85rem;text-decoration:none;cursor:pointer;}
  .timer-badge{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent-2);font-size:.9rem;}
  .toggle-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.9rem;cursor:pointer;}
  .toggle-row input{width:18px;height:18px;accent-color:var(--accent-2);}
  .file-label{display:inline-flex;align-items:center;padding:10px 16px;border:1px solid var(--accent-2);
    border-radius:10px;color:var(--accent-2);cursor:pointer;font-size:.9rem;font-weight:600;background:transparent;}
  .lb-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:8px;}
  .lb-table th,.lb-table td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;}
  .nav-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .nav-dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.02);
    color:var(--text);font-size:.8rem;cursor:pointer;padding:0;}
  .nav-dot.answered{border-color:var(--accent-2);background:rgba(255,183,3,.16);}
  .nav-dot.current{border-color:var(--accent);border-width:2px;font-weight:700;}
  input[type="text"]{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--border);
    background:rgba(255,255,255,.03);color:var(--text);font-size:.9rem;margin-bottom:10px;font-family:inherit;}
  .ed-wrap{position:relative;height:280px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.03);}
  .ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:10px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;overflow-y:scroll;overflow-x:hidden;border:0;letter-spacing:0;}
  .ed-hl{color:var(--text);pointer-events:none;}
  .ed-ta{background:transparent;color:transparent;caret-color:var(--accent-2);resize:none;outline:none;
    width:100%;height:100%;min-height:0;box-sizing:border-box;}
  .ed-ta::placeholder{color:var(--muted);opacity:.7;}
  .ed-ta::selection{background:rgba(255,183,3,.35);color:transparent;}
  .legend{margin-top:8px;}
  .set-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .set-info{flex:1 1 170px;min-width:0;}
  .set-name{font-weight:600;font-size:.92rem;}
  button.sm{padding:7px 11px;font-size:.8rem;}
  details.pv{margin-top:8px;}
  details.pv summary{cursor:pointer;color:var(--accent-2);font-size:.85rem;}
  .pv-q{margin:10px 0;font-size:.85rem;}
  .pv-opt{margin-left:14px;font-size:.82rem;}
  .pv-opt.ok{color:#ffb703;}
  .pv-red{color:#ff5252;font-weight:700;}
  .opt-l{color:var(--accent-2);font-weight:700;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#000;border:1px solid var(--accent-2);
    color:var(--text);padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%);}
  .hq{color:#ff5252;background:rgba(255,82,82,.16);border-radius:3px;}
  .ho0,.ho1,.ho2,.ho3,.hk{border-radius:3px;}
  .ho0{color:#ffd23f;background:rgba(255,210,63,.16);}
  .ho1{color:#4ade80;background:rgba(74,222,128,.16);}
  .ho2{color:#3b9dff;background:rgba(59,157,255,.18);}
  .ho3{color:#c084fc;background:rgba(192,132,252,.18);}
  .hk{color:#fff;background:rgba(255,255,255,.26);}
  .ierr{text-decoration:underline wavy #ff1744;text-decoration-thickness:2px;text-underline-offset:3px;}
  .iwarn{text-decoration:underline wavy #ff9800;text-decoration-thickness:2px;text-underline-offset:3px;}
  .L0{color:#ffd23f;font-weight:700;} .L1{color:#4ade80;font-weight:700;}
  .L2{color:#3b9dff;font-weight:700;} .L3{color:#c084fc;font-weight:700;}
  .issues{margin-top:10px;}
  .issues-title{font-size:.82rem;color:var(--accent-2);margin-bottom:6px;}
  button.issue{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);color:var(--text);border:1px solid var(--border);
    box-shadow:none;font-weight:500;font-size:.8rem;padding:7px 10px;margin-bottom:5px;border-radius:8px;}
  button.issue.e{border-color:#ff1744;} button.issue.w{border-color:#ff9800;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal{background:var(--card);border:1px solid var(--accent-2);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:85vh;overflow:auto;}
  .modal-list{margin-bottom:6px;}
  .modal-item{font-size:.83rem;padding:5px 0;border-bottom:1px solid var(--border);}
  .code-ta{min-height:90px;font-size:.72rem;word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;}
  /* Lò phản ứng khi làm bài: đứng yên, không sáng, không xoay */
  .arc-reactor.calm,.arc-reactor.calm::before,.arc-reactor.calm::after,.arc-reactor.calm .arc-spokes{animation:none !important;}
  .arc-reactor.calm{box-shadow:none;filter:none;opacity:.5;}
  .arc-reactor.calm::before,.arc-reactor.calm::after{box-shadow:none;}
  /* Hình ảnh trong câu hỏi / đáp án */
  .q-img{display:block;max-width:100%;max-height:300px;border-radius:8px;background:#fff;margin:8px 0;object-fit:contain;}
  .opt-img{display:block;max-width:100%;max-height:220px;border-radius:6px;background:#fff;margin:8px 0 2px;object-fit:contain;}
  .result-compare .opt-img{max-height:120px;}
  .pv-img{max-height:70px;max-width:45%;border-radius:4px;background:#fff;vertical-align:middle;margin:2px 4px 2px 0;}
  .img-tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.66rem;font-weight:600;color:var(--muted);
    border:1px solid var(--border);vertical-align:middle;margin-left:6px;letter-spacing:.02em;}
  .hi{color:#38bdf8;background:rgba(56,189,248,.16);border-radius:3px;}
  /* ===== Câu Đúng/Sai ===== */
  .tf-row,.tf-res{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.02);}
  .tf-row{display:flex;gap:10px;align-items:center;justify-content:space-between;}
  .tf-text{flex:1;min-width:0;font-size:.9rem;}
  .tf-btns{display:flex;gap:8px;flex-shrink:0;}
  .tf-btn{width:48px;height:42px;padding:0;font-size:1.25rem;line-height:1;background:rgba(255,255,255,.04);color:var(--muted);
    border:2px solid var(--border);box-shadow:none;border-radius:10px;transition:.15s;}
  .tf-btn.no.on{background:rgba(255,82,82,.3);border-color:#ff5252;color:#fff;box-shadow:0 0 14px 3px rgba(255,82,82,.75);}
  .tf-btn.yes.on{background:rgba(67,160,71,.32);border-color:#4ade80;color:#fff;box-shadow:0 0 14px 3px rgba(74,222,128,.75);}
  .tf-row.rv-ok{border-color:var(--ok);background:rgba(67,160,71,.14);}
  .tf-row.rv-bad{border-color:var(--bad);background:rgba(255,82,82,.14);}
  .tf-note{font-size:.8rem;font-weight:700;margin:-4px 0 8px 4px;}
  .tf-res.good{border-color:var(--ok);background:rgba(67,160,71,.12);}
  .tf-res.bad{border-color:var(--bad);border-width:2px;background:rgba(255,82,82,.16);}
  .tf-info{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;}
  .tf-info .opt-tag{margin-left:0;}
  .tf-pill{padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:800;}
  .tf-pill.ok{background:rgba(67,160,71,.28);color:var(--ok);border:1px solid #43a047;}
  .tf-pill.bad{background:rgba(255,82,82,.28);color:var(--bad);border:1px solid #ff5252;}
  .tf-pill.key{background:#f9a825;color:#1a1200;}
</style>
<style>
:root{--bg:#0e1118;--card:rgba(22,26,36,.72);--text:#f3f5fa;--muted:#9aa4b8;--accent:#6366f1;--accent-2:#7dd3fc;--border:rgba(255,255,255,.13);--ok:var(--ok);--bad:var(--bad);}
body{background:#0e1118;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.55;}
body::before,body::after,.arc-reactor{display:none!important;}
.wrap{max-width:720px;padding:30px 16px 120px;}
h1,.logo-title{color:var(--text);text-shadow:none;font-weight:800;letter-spacing:-.02em;font-size:1.7rem;}
.sub,.hint,.q-num{color:var(--muted);}
.card{background:var(--card);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 10px 34px rgba(0,0,0,.28);}
button{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border-radius:999px;padding:11px 20px;box-shadow:0 4px 16px rgba(99,102,241,.35);transition:transform .15s,filter .15s;}
button:hover{filter:brightness(1.12);transform:translateY(-1px);}
button.secondary{background:rgba(255,255,255,.07);color:var(--text);border:1px solid var(--border);box-shadow:none;}
button.sm{padding:8px 14px;}
textarea,input[type=text]{background:rgba(255,255,255,.06);border-radius:14px;color:var(--text);}
.opt{border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.05);transition:background .15s;}
.opt:hover:not(:disabled){background:rgba(255,255,255,.11);}
.opt.selected{border-color:var(--accent);background:rgba(99,102,241,.24);}
.nav-dot{border-radius:10px;}
.nav-dot.answered{border-color:var(--accent);background:rgba(99,102,241,.28);}
.progress{height:8px;border-radius:4px;}
.progress>div{background:linear-gradient(90deg,#6366f1,#06b6d4);}
.set-row{padding:14px 0;}
.modal{border:1px solid var(--border);border-radius:22px;background:rgba(20,24,34,.97);}
a.link-btn,.timer-badge,.score{color:var(--accent-2);}
#bgl{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0e1118;pointer-events:none;}
#bgl .bi,#bgl .bo{position:absolute;inset:0;}
#bgl .bi{background-repeat:no-repeat;background-position:center;}
#bgl .bo{background:#000;opacity:0;}

// ================== Parser: nhận diện câu hỏi & đáp án (ngang lẫn dọc) ==================
// Cách làm: chia đề thành từng khối theo "Câu N.", rồi trong mỗi khối tìm chuỗi nhãn
// A → B → C → D theo đúng thứ tự (bất kể đáp án nằm cùng dòng hay mỗi đáp án 1 dòng).
// Nhờ đó các đáp án như "A. A. B. T. C. C." không bị tách sai nữa.

function tokRe(){ return /\[\[IMG:\d+\]\]/g; }
function hasImg(s){ return /\[\[IMG:\d+\]\]/.test(s || ""); }

function findCandidates(s){
  const re = /(^|[\s(])([*⭐✓✔]\s*)?([A-Da-d])[.)](?=\s|$)/g;
  const out = [];
  let m;
  while((m = re.exec(s)) !== null){
    const start = m.index + m[1].length;
    const markLen = m[2] ? m[2].length : 0;
    out.push({
      idx: m[3].toUpperCase().charCodeAt(0) - 65,
      start, letterStart: start + markLen,
      end: m.index + m[0].length,
      marked: !!m[2],
      lower: m[3] === m[3].toLowerCase()
    });
  }
  return out;
}

function bestChain(cands){
  let best = [];
  for(let i = 0; i < cands.length; i++){
    if(cands[i].idx !== 0) continue;
    const chain = [cands[i]];
    let last = cands[i];
    for(let L = 1; L < 4; L++){
      const next = cands.find(c => c.idx === L && c.start >= last.end && c.lower === cands[i].lower);
      if(!next) break;
      chain.push(next);
      last = next;
    }
    if(chain.length > best.length) best = chain;
  }
  return best;
}

function cleanText(s){
  s = s.replace(/\s+/g, " ").trim();
  s = s.replace(/\s[-•]$/, "").trim();
  return s;
}

function findBlocks(text){
  const marks = [];
  let m;
  let re = /(^|\s)((?:Câu|CÂU|Question)\s*\d+\s*[.:)])/g;
  while((m = re.exec(text)) !== null){
    marks.push({ labelStart: m.index + m[1].length, labelEnd: m.index + m[0].length });
  }
  if(marks.length === 0){
    re = /^([ \t]*)(\d{1,3}\s*[.)])(?=\s)/gm;
    const alt = [];
    while((m = re.exec(text)) !== null){
      alt.push({ labelStart: m.index + m[1].length, labelEnd: m.index + m[0].length });
    }
    if(alt.length >= 2) marks.push(...alt);
  }
  if(marks.length){
    return marks.map((mk, i) => ({
      labelStart: mk.labelStart, labelEnd: mk.labelEnd,
      start: mk.labelStart,
      end: i + 1 < marks.length ? marks[i + 1].labelStart : text.length
    }));
  }
  const blocks = [];
  const re2 = /[^\n]+(?:\n(?!\s*\n)[^\n]*)*/g;
  while((m = re2.exec(text)) !== null){
    if(m[0].trim()) blocks.push({ labelStart: m.index, labelEnd: m.index, start: m.index, end: m.index + m[0].length });
  }
  return blocks;
}

function blockTarget(text, b){
  if(b.labelEnd > b.labelStart) return [b.labelStart, b.labelEnd];
  return [b.start, Math.max(Math.min(b.end, b.start + 25), b.start + 1)];
}

function parseBlock(text, b, title){
  const base = b.labelEnd;
  const raw = text.slice(b.labelEnd, b.end);
  const hl = [], issues = [];
  const [ts, te] = blockTarget(text, b);
  const add = (level, msg, s = ts, e = te) => issues.push({ level, msg: `${title}: ${msg}`, s, e });
  if(b.labelEnd > b.labelStart) hl.push({ s: b.labelStart, e: b.labelEnd, c: "hq" });

  const cands = findCandidates(raw);
  const chain = bestChain(cands);
  if(chain.length >= 2){
    let stem = cleanText(raw.slice(0, chain[0].start));
    const opts = [];
    let correct = null;
    const isTf = chain[0].lower;   // a. b. c. d. (chữ thường) = câu Đúng/Sai
    const truth = [];
    chain.forEach((c, k) => {
      let t = cleanText(raw.slice(c.end, k + 1 < chain.length ? chain[k + 1].start : raw.length));
      let mk = c.marked;
      const tm = t.match(/\s*[⭐✓✔]$/);
      if(tm){ t = t.slice(0, t.length - tm[0].length).trim(); mk = true; }
      opts.push(t);
      truth.push(!!mk);
      if(mk && correct == null) correct = k;
      if(c.marked) hl.push({ s: base + c.start, e: base + c.start + 1, c: "hk" });
      hl.push({ s: base + c.letterStart, e: base + c.end, c: "ho" + k });
    });
    // "Đáp án: B" nằm ngay sau câu → tự đánh dấu đáp án đúng
    if(!isTf && correct == null){
      const km = opts[opts.length - 1].match(/\s*(?:Đáp án|ĐÁP ÁN|ĐA|Answer)\s*[:：=]\s*([A-Da-d])\b\.?\s*$/i);
      if(km){
        opts[opts.length - 1] = opts[opts.length - 1].slice(0, km.index).trim();
        const ci = "ABCD".indexOf(km[1].toUpperCase());
        if(ci >= 0 && ci < opts.length){ correct = ci; truth[ci] = true; }
      }
    }
    // Ảnh nằm phía trên dãy nhãn A B C D → ghép theo thứ tự thành đáp án
    const stemToks = stem.match(tokRe()) || [];
    if(stemToks.length >= chain.length && opts.every(o => !o)){
      const use = stemToks.slice(-chain.length);
      use.forEach((t, k) => { opts[k] = t; });
      let st = stem;
      for(let k = use.length - 1; k >= 0; k--){ const p = st.lastIndexOf(use[k]); st = st.slice(0, p) + st.slice(p + use[k].length); }
      stem = cleanText(st);
    }
    opts.forEach((t, k) => { if(!t) add("err", `đáp án ${"ABCD"[k]} bị trống`, base + chain[k].letterStart, base + chain[k].end); });
    if(chain.length < 4){
      const last = chain[chain.length - 1];
      const stray = cands.find(c => c.idx >= chain.length && c.start >= last.end);
      if(stray) add("err", `thấy nhãn ${"ABCD"[stray.idx]} nhưng thiếu hoặc lỗi nhãn ${"ABCD"[chain.length]}`);
      else add("warn", `chỉ có ${chain.length} đáp án (thiếu ${"ABCD".slice(chain.length).split("").join(", ")})`);
    }
    if(isTf) return { q: { q: stem || "(chưa có nội dung câu hỏi)", opts, tf: true, truth, correct: 0, hasMarker: true }, hl, issues };
    if(correct == null) add("warn", "chưa đánh dấu đáp án đúng (* hoặc ⭐)");
    return { q: { q: stem || "(chưa có nội dung câu hỏi)", opts, correct: correct == null ? 0 : correct, hasMarker: correct != null }, hl, issues };
  }

  // Câu Trả lời ngắn: không có nhãn A B C D, có dòng "Đáp án: …"
  {
    const re = /(?:^|\s)(Đáp án|ĐÁP ÁN|ĐA|Kết quả|KQ|Trả lời|Answer)[ \t]*[:：=][ \t]*([^\n]+)/gi;
    let m, last = null;
    while((m = re.exec(raw)) !== null) last = m;
    if(last){
      const ans = last[2].split(/\s*[|;]\s*/).map(t => cleanText(t).replace(/\.+$/, "").trim()).filter(Boolean);
      const stem = cleanText(raw.slice(0, last.index));
      const kStart = base + last.index + (last[0].length - last[0].trimStart().length);
      hl.push({ s: kStart, e: base + last.index + last[0].length, c: "hk" });
      if(!ans.length) add("err", "câu Trả lời ngắn chưa có đáp án sau “Đáp án:”");
      return { q: { q: stem || "(chưa có nội dung câu hỏi)", opts: [], sa: true, ans, correct: 0, hasMarker: true }, hl, issues };
    }
  }

  // Dự phòng: không có nhãn A B C D nhưng có hình → hình là đáp án A, B, C, D theo thứ tự
  const toks = [];
  { const tr = tokRe(); let tm; while((tm = tr.exec(raw)) !== null) toks.push({ s: tm.index, e: tm.index + tm[0].length, t: tm[0] }); }
  if(toks.length >= 2){
    const optToks = toks.slice(-Math.min(toks.length, 4));
    let corr = null;
    optToks.forEach((o, k) => {
      const gap = k === 0 ? raw.slice(Math.max(0, o.s - 4), o.s) : raw.slice(optToks[k - 1].e, o.s);
      const mk = k === 0 ? /[*⭐✓✔]\s*$/.test(gap) : /[*⭐✓✔]/.test(gap);
      if(mk && corr == null) corr = k;
    });
    const stemTxt = cleanText(raw.slice(0, optToks[0].s)).replace(/\s*[*⭐✓✔]$/, "").trim();
    if(optToks.length < 4) add("warn", `chỉ có ${optToks.length} đáp án hình`);
    if(corr == null) add("warn", "chưa đánh dấu đáp án đúng (đặt * hoặc ⭐ ngay trước hình đáp án)");
    return { q: { q: stemTxt || "(chưa có nội dung câu hỏi)", opts: optToks.map(o => o.t), correct: corr == null ? 0 : corr, hasMarker: corr != null }, hl, issues };
  }

  // Dự phòng: đáp án chỉ có gạch đầu dòng / dấu * ⭐ ✓, không có nhãn A B C D
  const BUL = /^(\s*)([-•*⭐✓✔])\s*/;
  const stemParts = [], opts = [];
  let correct = null, off = 0;
  raw.split("\n").forEach(line => {
    const m = line.match(BUL);
    if(m){
      const mk = /[*⭐✓✔]/.test(m[2]);
      if(mk && correct == null) correct = opts.length;
      opts.push(cleanText(line.slice(m[0].length)));
      hl.push({ s: base + off + m[1].length, e: base + off + m[1].length + 1, c: mk ? "hk" : "ho" + ((opts.length - 1) % 4) });
    } else if(line.trim()){
      if(!opts.length) stemParts.push(line.trim());
      else opts[opts.length - 1] = cleanText(opts[opts.length - 1] + " " + line.trim());
    }
    off += line.length + 1;
  });
  if(opts.length < 2){
    add("err", "không nhận diện được đáp án nào (cần nhãn A. B. C. D., gạch đầu dòng, hoặc dòng “Đáp án: …” cho câu trả lời ngắn)");
    return { q: null, hl, issues };
  }
  opts.forEach((t, k) => { if(!t) add("err", `đáp án thứ ${k + 1} bị trống`); });
  if(opts.length < 4) add("warn", `chỉ có ${opts.length} đáp án`);
  if(correct == null) add("warn", "chưa đánh dấu đáp án đúng (* hoặc ⭐)");
  return {
    q: { q: cleanText(stemParts.join(" ")) || "(chưa có nội dung câu hỏi)", opts, correct: correct == null ? 0 : correct, hasMarker: correct != null },
    hl, issues
  };
}

function parseQuizCore(text){
  const questions = [], highlights = [], issues = [];
  let prevNum = null;
  findBlocks(text).forEach(b => {
    const nm = text.slice(b.labelStart, b.labelEnd).match(/\d+/);
    const num = nm ? parseInt(nm[0], 10) : null;
    const title = num != null ? `Câu ${num}` : "Đoạn không đánh số";
    const [ts, te] = blockTarget(text, b);
    if(num != null && prevNum != null){
      if(num > prevNum + 1) issues.push({ level: "warn", msg: `${title}: nhảy từ Câu ${prevNum} sang Câu ${num} (có thể thiếu câu ở giữa)`, s: ts, e: te });
      else if(num <= prevNum) issues.push({ level: "warn", msg: `${title}: bị lặp hoặc đảo số (đứng sau Câu ${prevNum})`, s: ts, e: te });
    }
    if(num != null) prevNum = num;
    const r = parseBlock(text, b, title);
    issues.push(...r.issues);
    highlights.push(...r.hl);
    if(r.q) questions.push(r.q);
  });
  { const tr = tokRe(); let tm; while((tm = tr.exec(text)) !== null) highlights.push({ s: tm.index, e: tm.index + tm[0].length, c: "hi" }); }
  issues.sort((a, b) => a.s - b.s);
  return { questions, highlights, issues };
}

// Bảng đáp án ở cuối đề ("ĐÁP ÁN" rồi 1.A 2.B 3.C …) → tự gán đáp án đúng cho câu trắc nghiệm
function parseQuiz(text){
  const hm = /\n[ \t]*(?:BẢNG\s+)?ĐÁP\s*ÁN[ \t:：]*(?:CHI TIẾT)?[ \t:：]*\n([\s\S]*)$/i.exec(text);
  if(!hm) return parseQuizCore(text);
  const pairs = []; const pr = /(\d{1,3})\s*[.\-–:)]*\s*([A-Da-d])(?![A-Za-zÀ-ỹ])/g; let pm;
  while((pm = pr.exec(hm[1])) !== null) pairs.push([parseInt(pm[1], 10), pm[2].toUpperCase()]);
  if(pairs.length < 3) return parseQuizCore(text);
  const r = parseQuizCore(text.slice(0, hm.index));
  pairs.forEach(([n, L]) => {
    const q = r.questions[n - 1], ci = "ABCD".indexOf(L);
    if(q && !q.tf && !q.sa && !q.hasMarker && ci < q.opts.length){
      q.correct = ci; q.hasMarker = true;
      r.issues = r.issues.filter(i => !(i.msg.startsWith(`Câu ${n}:`) && i.msg.includes("chưa đánh dấu")));
    }
  });
  return r;
}

function firstIssue(issues){
  return issues.find(i => i.level === "err") || issues[0] || null;
}

function highlightHtml(text, ranges, markerPos){
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const ev = [];
  ranges.forEach(r => { if(r.e > r.s){ ev.push([r.s, 1, r.c]); ev.push([r.e, 0, r.c]); } });
  ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let pos = 0, out = "", marked = markerPos == null;
  const active = [];
  const emit = (upto) => {
    while(pos < upto){
      let end = upto;
      if(!marked && markerPos > pos && markerPos < upto) end = markerPos;
      if(!marked && markerPos === pos){ out += '<span id="jm"></span>'; marked = true; }
      const seg = esc(text.slice(pos, end));
      out += active.length ? `<span class="${active.join(" ")}">${seg}</span>` : seg;
      pos = end;
    }
  };
  for(const [p, t, c] of ev){
    emit(p);
    if(t) active.push(c); else { const k = active.indexOf(c); if(k >= 0) active.splice(k, 1); }
  }
  emit(text.length);
  if(!marked) out += '<span id="jm"></span>';
  return out + "\n";
}

// ================== Xuất / đọc file Word (.docx) ==================
function escXml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function buildDocxBlob(questions){
  const LETTERS = "ABCDEFGH";
  const paras = [];
  questions.forEach((q, qi) => {
    paras.push(`Câu ${qi + 1}. ${q.q.replace(tokRe(), "[hình ảnh]")}`);
    q.opts.forEach((opt, oi) => {
      const label = (q.tf ? "abcdefgh" : LETTERS)[oi] || String(oi + 1);
      const star = (q.tf ? q.truth[oi] : oi === q.correct) ? "⭐ " : "";
      paras.push(`${star}${label}. ${opt.replace(tokRe(), "[hình ảnh]")}`);
    });
    if(q.sa) paras.push(`Đáp án: ${q.ans.join(" | ")}`);
    paras.push("");
  });
  const bodyXml = paras.map(line =>
    line === "" ? "<w:p/>" : `<w:p><w:r><w:t xml:space="preserve">${escXml(line)}</w:t></w:r></w:p>`
  ).join("");
  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${bodyXml}<w:sectPr/></w:body></w:document>`;
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:sz w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`;

  const zip = new JSZip();
  zip.file("[Content_Types].xml", contentTypes);
  zip.folder("_rels").file(".rels", rootRels);
  const wf = zip.folder("word");
  wf.file("document.xml", documentXml);
  wf.file("styles.xml", stylesXml);
  wf.folder("_rels").file("document.xml.rels", docRels);
  return await zip.generateAsync({ type: "blob" });
}

async function shrinkImage(dataUri, maxSide = 520, quality = 0.8){
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUri; });
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    if(!w0 || !h0) return dataUri;
    const sc = Math.min(1, maxSide / Math.max(w0, h0));
    const cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.round(w0 * sc)); cv.height = Math.max(1, Math.round(h0 * sc));
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", quality);
  }catch(e){ return dataUri; }
}

// Trả về { text, images, skipped }. Mỗi hình trong Word thành thẻ [[IMG:n]] đúng vị trí xuất hiện.
// ---- Đọc nhiều loại file: Word, PDF, TXT, ODT, HTML, ZIP (Google Docs) ----
let _pdfP = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfP) return _pdfP;
  _pdfP = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(); };
    sc.onerror = () => { _pdfP = null; rej(new Error("load")); };
    document.head.appendChild(sc);
  });
  return _pdfP;
}
async function readPdfToText(file){
  await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let out = "";
  for(let pg = 1; pg <= pdf.numPages; pg++){
    const tc = await (await pdf.getPage(pg)).getTextContent();
    let lastY = null, lastEnd = 0, line = "";
    tc.items.forEach(it => {
      if(!it.str) return;
      const x = it.transform[4], y = it.transform[5];
      if(lastY !== null && Math.abs(y - lastY) > 3){ out += line.trim() + "\n"; line = ""; lastEnd = 0; }
      if(line && x - lastEnd > 1.5 && !/\s$/.test(line) && !/^\s/.test(it.str)) line += " ";
      line += it.str; lastY = y; lastEnd = x + (it.width || 0);
    });
    out += line.trim() + "\n";
  }
  if(out.replace(/\s/g, "").length < 20) throw new Error("scan-pdf");
  return out;
}
async function readOdtToText(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const e = zip.file("content.xml"); if(!e) throw new Error("bad-odt");
  const doc = new DOMParser().parseFromString(await e.async("string"), "application/xml");
  const textOf = n => Array.from(n.childNodes).map(c => c.nodeType === 3 ? c.data : (c.localName === "tab" ? "\t" : c.localName === "line-break" ? "\n" : c.localName === "s" ? " " : textOf(c))).join("");
  const out = [];
  const walk = n => { if(n.localName === "p" || n.localName === "h"){ out.push(textOf(n)); return; } Array.from(n.children || []).forEach(walk); };
  walk(doc.documentElement);
  return out.join("\n");
}
function htmlToText(h){
  const d = new DOMParser().parseFromString(h, "text/html");
  d.querySelectorAll("script,style,head").forEach(n => n.remove());
  d.querySelectorAll("br").forEach(n => n.replaceWith("\n"));
  d.querySelectorAll("p,div,li,tr,h1,h2,h3,h4,h5,h6").forEach(n => n.appendChild(d.createTextNode("\n")));
  return ((d.body || d.documentElement).textContent || "").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
}
async function readAnyFile(file){
  const ext = ((file.name.toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1]) || "";
  if(ext === "docx") return await readDocxToText(file);
  if(ext === "doc") throw new Error("old-doc");
  if(ext === "pdf") return { text: await readPdfToText(file), images: {} };
  if(ext === "odt") return { text: await readOdtToText(file), images: {} };
  if(ext === "html" || ext === "htm") return { text: htmlToText(await file.text()), images: {} };
  if(ext === "zip"){
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const f = Object.keys(zip.files).find(n => /\.html?$/i.test(n));
    if(!f) throw new Error("bad-zip");
    return { text: htmlToText(await zip.file(f).async("string")), images: {} };
  }
  return { text: await file.text(), images: {} };
}
function fileErrorMsg(err){
  const m = err && err.message;
  if(m === "old-doc") return "File .doc đời cũ chưa đọc được. Hãy mở bằng Word rồi Lưu thành .docx.";
  if(m === "scan-pdf") return "PDF này là ảnh scan nên không có chữ để đọc. Hãy dùng PDF xuất từ Word / Google Docs.";
  if(m === "load") return "Cần có mạng để đọc PDF ở lần đầu tiên. Hãy kiểm tra mạng rồi thử lại.";
  return "Không đọc được file này. Thử lưu lại thành .docx hoặc .pdf rồi tải lên lại.";
}
async function readDocxToText(file){
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const entry = zip.file("word/document.xml");
  if(!entry) throw new Error("no-document-xml");
  const xmlDoc = new DOMParser().parseFromString(await entry.async("string"), "application/xml");
  const rels = {};
  const rf = zip.file("word/_rels/document.xml.rels");
  if(rf){
    const rd = new DOMParser().parseFromString(await rf.async("string"), "application/xml");
    Array.from(rd.getElementsByTagName("Relationship")).forEach(r => { rels[r.getAttribute("Id")] = r.getAttribute("Target"); });
  }
  const MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", bmp: "image/bmp", webp: "image/webp", svg: "image/svg+xml" };
  const images = {}, byPath = {};
  let n = 0, skipped = 0;
  const imgTok = async (rid) => {
    const target = rels[rid];
    if(!target) return "";
    if(byPath[target]) return ` [[IMG:${byPath[target]}]] `;
    const path = target.startsWith("/") ? target.slice(1) : "word/" + target.replace(/^\.\//, "");
    const f = zip.file(path);
    const mime = MIME[path.split(".").pop().toLowerCase()];
    n++; byPath[target] = n;
    if(f && mime) images[n] = await shrinkImage(`data:${mime};base64,` + await f.async("base64"));
    else { images[n] = null; skipped++; }
    return ` [[IMG:${n}]] `;
  };
  const walk = async (node, out) => {
    for(const c of Array.from(node.childNodes)){
      const nm = c.nodeName;
      if(nm === "mc:Fallback" || nm === "w:p") continue;
      if(nm === "w:t") out.s += c.textContent;
      else if(nm === "a:blip") out.s += await imgTok(c.getAttribute("r:embed") || c.getAttribute("r:link"));
      else if(nm === "v:imagedata") out.s += await imgTok(c.getAttribute("r:id"));
      else if(c.nodeType === 1) await walk(c, out);
    }
  };
  const paras = xmlDoc.getElementsByTagName("w:p");
  const lines = [];
  for(let i = 0; i < paras.length; i++){ const o = { s: "" }; await walk(paras[i], o); lines.push(o.s); }
  return { text: lines.join("\n"), images, skipped };
}

function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function formatTime(sec){

  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

  }, 1000);
}

// ================== Chia sẻ đề bằng mã ==================
function b64url(u8){
  let s = "";
  for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while(s.length % 4) s += "=";
  const b = atob(s), u = new Uint8Array(b.length);
  for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
// Mã đề:
// - TN4.xxxxx  = mã ngắn (~15 ký tự): nội dung lưu trên dpaste.com (cần mạng khi tạo & nhập)
// - TN3.xxxxx  = offline, nén deflate + base64 (dài hơn, không cần mạng)
// - TN2 / TN1 / TN0 = mã cũ vẫn đọc được
async function deflateRaw(bytes){
  const cs = new CompressionStream("deflate-raw");
  const w = cs.writable.getWriter(); w.write(bytes); w.close();
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function inflateRaw(bytes){
  const ds = new DecompressionStream("deflate-raw");
  const w = ds.writable.getWriter(); w.write(bytes); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
function toCompactText(name, qs){
  return name.replace(/\s+/g, " ").trim() + "\n" +
    qs.map(q => (q.sa ? "S" + q.ans.join("|") : q.tf ? "T" + q.truth.map(t => t ? 1 : 0).join("") : (q.hasMarker ? q.correct : -1)) + "\t" + q.q.replace(/\t/g, " ") + "\t" +
      q.opts.map(o => o.replace(/\t/g, " ")).join("\t")).join("\n");
}
function fromCompactText(str){
  const lines = str.split("\n");
  const name = lines.shift() || "Đề được chia sẻ";
  const text = lines.filter(ln => ln.trim()).map((ln, i) => {
    const p = ln.split("\t");
    const correct = parseInt(p[0], 10);
    if(p[0][0] === "S") return `Câu ${i + 1}. ${p[1]}\nĐáp án: ${p[0].slice(1)}`;
    const isT = p[0][0] === "T";
    const opts = p.slice(2);
    if(!opts.length) throw new Error("bad-data");
    return `Câu ${i + 1}. ${p[1]} ` + opts.map((o, k) => isT ? `${p[0][k + 1] === "1" ? "⭐ " : ""}${"abcd"[k]}. ${o}` : `${k === correct ? "⭐ " : ""}${"ABCD"[k]}. ${o}`).join(" ");
  }).join("\n\n");
  return { name, text };
}
function toCjk(u8){
  let out = "", acc = 0, bits = 0;
  for(const byte of u8){
    acc = (acc << 8) | byte; bits += 8;
    while(bits >= 14){ bits -= 14; out += String.fromCharCode(0x4E00 + ((acc >> bits) & 0x3FFF)); acc &= (1 << bits) - 1; }
  }
  if(bits > 0) out += String.fromCharCode(0x4E00 + ((acc << (14 - bits)) & 0x3FFF));
  return out;
}
function fromCjk(str, n){
  const u = new Uint8Array(n);
  let acc = 0, bits = 0, k = 0;
  for(let i = 0; i < str.length && k < n; i++){
    const v = str.charCodeAt(i) - 0x4E00;
    if(v < 0 || v > 0x3FFF) continue;
    acc = (acc << 14) | v; bits += 14;
    while(bits >= 8 && k < n){ bits -= 8; u[k++] = (acc >> bits) & 0xFF; }
    acc &= (1 << bits) - 1;
  }
  if(k < n) throw new Error("short");
  return u;
}
// Offline: ASCII only (TN3) — luôn hoạt động, không cần mạng
// Mã siêu ngắn: nén rồi đổi sang chữ Hán (14 bit/ký tự) → ít ký tự hơn base64 hơn một nửa
function cjkPack(prefix, bytes){
  const n = bytes.length;
  return prefix + String.fromCharCode(0x4E00 + (n >> 14), 0x4E00 + (n & 0x3FFF)) + toCjk(bytes);
}
async function packSetOffline(name, text, images){
  const imgs = pruneImages(images || {}, text);
  if(Object.keys(imgs).length){
    // Có hình → mã TN5 (kèm hình đã thu nhỏ để nhẹ hơn)
    const small = {};
    for(const k of Object.keys(imgs)) small[k] = await shrinkImage(imgs[k], 380, 0.6);
    const bytes = new TextEncoder().encode(JSON.stringify({ n: name, t: text, i: small }));
    if(typeof CompressionStream !== "undefined"){
      try{ return "TN5." + b64url(await deflateRaw(bytes)); }catch(e){}
    }
    return "TN6." + b64url(bytes);
  }
  const qs = parseQuiz(text).questions;
  if(qs.length && typeof CompressionStream !== "undefined"){
    try{
      const z = await deflateRaw(new TextEncoder().encode(toCompactText(name, qs)));
      return "TN3." + b64url(z);
    }catch(e){}
  }
  return "TN0." + b64url(new TextEncoder().encode(JSON.stringify({ n: name, t: text })));
}
// Online: upload lên dpaste.com → mã cực ngắn TN4.ID (cần mạng 2 đầu)
async function packSetOnline(offlineCode){
  const body = new URLSearchParams();
  body.set("content", offlineCode);
  body.set("expiry_days", "365");
  body.set("syntax", "text");
  const res = await fetch("https://dpaste.com/api/", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: body.toString()
  });
  if(!res.ok) throw new Error("upload-failed-" + res.status);
  const loc = res.headers.get("location") || (await res.text()).trim().replace(/^"|"$/g, "");
  const m = String(loc).match(/dpaste\.com\/([A-Za-z0-9]+)/i);
  if(!m) throw new Error("no-id");
  return "TN4." + m[1];
}
async function fetchTn4Payload(id){
  // Thử vài URL; không gắn header lạ để tránh preflight CORS
  const urls = [
    "https://dpaste.com/" + id + ".txt",
    "https://dpaste.com/" + id + "/raw",
    "https://dpaste.com/raw/" + id
  ];
  let lastErr = null;
  for(const url of urls){
    try{
      const res = await fetch(url, { method: "GET", mode: "cors", cache: "no-store" });
      if(!res.ok){ lastErr = new Error("fetch-failed-" + res.status); continue; }
      const payload = (await res.text()).trim();
      if(!payload || payload.startsWith("<!") || /blocked|Terms of Service|Too Many/i.test(payload)){
        lastErr = new Error("bad-payload");
        continue;
      }
      if(!(payload.startsWith("TN7.") || payload.startsWith("TN5.") || payload.startsWith("TN6.") || payload.startsWith("TN3.") || payload.startsWith("TN0.") || payload.startsWith("TN1.") || payload.startsWith("TN2."))){
        lastErr = new Error("bad-payload");
        continue;
      }
      return payload;
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error("fetch-failed");
}
async function unpackSet(code){
  code = code.replace(/\s+/g, "");
  // Cho phép dán cả URL dpaste
  const urlId = code.match(/dpaste\.com\/([A-Za-z0-9]+)/i);
  if(urlId) code = "TN4." + urlId[1];
  const pre = code.slice(0, 4);
  if(pre === "TN4."){
    const id = code.slice(4).replace(/[^A-Za-z0-9]/g, "");
    if(!id) throw new Error("bad-id");
    const payload = await fetchTn4Payload(id);
    return unpackSet(payload);
  }
  if(pre === "TN7."){
    const n = ((code.charCodeAt(4) - 0x4E00) << 14) + (code.charCodeAt(5) - 0x4E00);
    const o = JSON.parse(new TextDecoder().decode(await inflateRaw(fromCjk(code.slice(6), n))));
    if(typeof o.t !== "string") throw new Error("bad-data");
    return { name: o.n || "Đề được chia sẻ", text: o.t, images: o.i || {} };
  }
  if(pre === "TN5." || pre === "TN6."){
    let b = unb64url(code.slice(4));
    if(pre === "TN5.") b = await inflateRaw(b);
    const o = JSON.parse(new TextDecoder().decode(b));
    if(typeof o.t !== "string") throw new Error("bad-data");
    return { name: o.n || "Đề được chia sẻ", text: o.t, images: o.i || {} };
  }
  if(pre === "TN3."){
    return fromCompactText(new TextDecoder().decode(await inflateRaw(unb64url(code.slice(4)))));
  }
  if(pre === "TN2."){
    const n = ((code.charCodeAt(4) - 0x4E00) << 14) + (code.charCodeAt(5) - 0x4E00);
    const z = fromCjk(code.slice(6), n);
    return fromCompactText(new TextDecoder().decode(await inflateRaw(z)));
  }
  if(pre !== "TN0." && pre !== "TN1.") throw new Error("bad-prefix");
  let bytes = unb64url(code.slice(4));
  if(pre === "TN1.") bytes = await inflateRaw(bytes);
  const o = JSON.parse(new TextDecoder().decode(bytes));
  if(typeof o.t !== "string") throw new Error("bad-data");
  return { name: o.n || "Đề được chia sẻ", text: o.t };
}
async function copyText(text, fallbackEl){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{
    let t = fallbackEl;
    if(!t){ t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); }
    t.focus(); t.select();
    const ok = document.execCommand("copy");
    if(!fallbackEl) t.remove();
    return ok;
  }catch(e){ return false; }
}
function isNetworkErr(e){
  const msg = String(e && (e.message || e.name) || e);
  return /fetch-failed|Failed to fetch|NetworkError|Load failed|network|CORS|blocked|bad-payload|TypeError/i.test(msg);
}

// ================== DOM helper ==================
function el(tag, attrs = {}, children = []){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if(v == null) return;
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if(c == null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}
function makeReactor(extraClass){
  const r = el("div", { class: "arc-reactor" + (extraClass ? " " + extraClass : ""), title: "Arc Reactor" });
  r.appendChild(el("div", { class: "arc-spokes" }));
  return r;
}

// ================== Hiển thị chữ + hình ==================
function pruneImages(imgs, text){
  const o = {};
  (text.match(tokRe()) || []).forEach(t => { const k = t.match(/\d+/)[0]; if(imgs && imgs[k]) o[k] = imgs[k]; });
  return o;
}
function richNodes(text, images, cls){
  const out = [];
  const re = tokRe();
  let last = 0, m;
  text = text || "";
  while((m = re.exec(text)) !== null){
    const t = text.slice(last, m.index);
    if(t.trim()) out.push(t);
    const src = images && images[m[0].match(/\d+/)[0]];
    out.push(src ? el("img", { class: cls, src, alt: "hình ảnh" }) : el("span", { class: "img-tag" }, "(thiếu hình)"));
    last = m.index + m[0].length;
  }
  const t = text.slice(last);
  if(t.trim() || !out.length) out.push(t);
  return out;
}

// ================== Câu Đúng/Sai ==================
function qDone(i){
  const a = state.answers[i];
  if(typeof a === "string") return a.trim() !== "";
  return Array.isArray(a) ? a.every(v => v !== null) : a != null;
}
function normSa(s){
  return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D")
    .replace(/[−–—]/g, "-").toLowerCase().trim().replace(/\s+/g, " ");
}
function saNum(s){ const t = s.replace(/\s/g, "").replace(",", "."); return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(t) ? parseFloat(t) : null; }
function saMatch(q, a){
  const x = normSa(a); if(!x) return false;
  const nx = saNum(x);
  return (q.ans || []).some(t => { const y = normSa(t); if(x === y) return true; const ny = saNum(y); return nx !== null && ny !== null && Math.abs(nx - ny) < 1e-9; });
}
function qTypePill(q){
  const t = q.sa ? ["sa", "Trả lời ngắn"] : q.tf ? ["tf", "Đúng / Sai"] : ["mc", "Trắc nghiệm"];
  return el("div", { style: "margin-bottom:8px;" }, el("span", { class: "qtype " + t[0] }, t[1]));
}

function renderTfResult(c, q, a){

function openQuestionBuilder(getNext, onAdd){
  let type = "mc";
  const bg = el("div", { class: "modal-bg" }), box = el("div", { class: "modal" });
  box.appendChild(el("div", { class: "q-text" }, "Thêm câu hỏi"));
  const tabs = el("div", { class: "row", style: "margin:8px 0;" });
  const stem = el("textarea", { placeholder: "Nội dung câu hỏi…", style: "min-height:84px;" });
  const body = el("div");
  const msg = el("div", { style: "min-height:20px;margin:6px 0;color:var(--bad);font-size:.9rem;" });
  let ins = [], marks = [], radioName = "bq" + Date.now();
  const types = [["mc", "Trắc nghiệm"], ["tf", "Đúng/Sai"], ["sa", "Trả lời ngắn"]];
  function draw(){
    tabs.innerHTML = ""; body.innerHTML = ""; ins = []; marks = []; msg.textContent = "";
    types.forEach(t => tabs.appendChild(el("button", { class: "sm" + (t[0] === type ? "" : " secondary"), onclick: () => { type = t[0]; draw(); } }, t[1])));
    if(type === "sa"){
      body.appendChild(el("div", { class: "hint", style: "margin:6px 0;" }, "Đáp án đúng (nhiều cách viết đúng thì ngăn cách bằng dấu | )"));
      const i = el("input", { type: "text", placeholder: "Ví dụ: 2,5 | 2.5" }); ins.push(i); body.appendChild(i);
      return;
    }
    body.appendChild(el("div", { class: "hint", style: "margin:6px 0;" }, type === "mc" ? "Gõ các đáp án rồi chọn ⦿ vào đáp án đúng" : "Gõ các ý rồi tick ☑ vào ý ĐÚNG"));
    for(let k = 0; k < 4; k++){
      const inp = el("input", { type: "text", placeholder: (type === "mc" ? "Đáp án " + "ABCD"[k] : "Ý " + "abcd"[k]) });
      const mk = el("input", type === "mc" ? { type: "radio", name: radioName } : { type: "checkbox" });
      ins.push(inp); marks.push(mk);
      body.appendChild(el("label", { class: "toggle-row", style: "gap:10px;align-items:center;" }, [mk, inp]));
    }
  }
  function build(){
    const q = stem.value.trim(); if(!q) return { err: "Hãy nhập nội dung câu hỏi." };
    const n = getNext();
    if(type === "sa"){
      const a = ins[0].value.trim(); if(!a) return { err: "Hãy nhập đáp án đúng." };
      return { text: `Câu ${n}. ${q}\nĐáp án: ${a}` };
    }
    const rows = ins.map((i, k) => ({ t: i.value.trim(), ok: marks[k].checked })).filter(r => r.t);
    if(rows.length < 2) return { err: "Cần ít nhất 2 đáp án." };
    if(!rows.some(r => r.ok)) return { err: type === "mc" ? "Hãy chọn đáp án đúng." : "Hãy tick ít nhất một ý đúng." };
    const L = type === "mc" ? "ABCD" : "abcd";
    return { text: `Câu ${n}. ${q}\n` + rows.map((r, k) => (r.ok ? "⭐ " : "") + L[k] + ". " + r.t).join("\n") };
  }
  const done = (keep) => {
    const r = build(); if(r.err){ msg.textContent = r.err; return; }
    onAdd(r.text); toast("Đã thêm câu hỏi ");
    if(keep){ stem.value = ""; draw(); stem.focus(); } else bg.remove();
  };
  const row = el("div", { class: "row", style: "margin-top:8px;" }, [
    el("button", { onclick: () => done(false) }, "Thêm & đóng"),
    el("button", { class: "secondary", onclick: () => done(true) }, "Thêm & viết tiếp"),
    el("button", { class: "secondary", onclick: () => bg.remove() }, "Hủy")
  ]);
  box.appendChild(tabs); box.appendChild(stem); box.appendChild(body); box.appendChild(msg); box.appendChild(row);
  bg.appendChild(box); document.body.appendChild(bg);
  draw();
}
function buildEditor(initialText, onParsed){
  const wrap = el("div", { class: "ed-wrap" });
  const hl = el("div", { class: "ed-hl", "aria-hidden": "true" });
  const ta = el("textarea", {
    class: "ed-ta", spellcheck: "false",
    placeholder: "Dán đề vào đây… (Câu 1. … A. … B. … C. … D. …). Đáp án đúng đánh dấu bằng * hoặc ⭐ trước chữ cái. Câu Đúng/Sai: dùng a. b. c. d. Câu Trả lời ngắn: thêm dòng “Đáp án: …”. (chữ thường), ý nào đúng thì đánh dấu *."
  });
  ta.value = initialText;
  wrap.appendChild(hl);
  wrap.appendChild(ta);
  let last = { questions: [], highlights: [], issues: [] };
  // Lịch sử để hoàn tác / làm lại
  const hist = [initialText]; let hi = 0, ht = null;
  const undoBtn = el("button", { class: "secondary sm", title: "Hoàn tác (Ctrl+Z)", disabled: "disabled" }, "↶");
  const redoBtn = el("button", { class: "secondary sm", title: "Làm lại (Ctrl+Y)", disabled: "disabled" }, "↷");
  function upd(){ undoBtn.disabled = hi <= 0; redoBtn.disabled = hi >= hist.length - 1; }
  function snap(){
    const v = ta.value; if(v === hist[hi]) return;
    hist.splice(hi + 1); hist.push(v); if(hist.length > 200) hist.shift();
    hi = hist.length - 1; upd();
  }
  function go(d){
    clearTimeout(ht); snap();
    const j = hi + d; if(j < 0 || j >= hist.length) return;
    hi = j; ta.value = hist[hi]; paint(); upd();
  }
  undoBtn.onclick = () => go(-1); redoBtn.onclick = () => go(1);
  ta.addEventListener("keydown", e => {
    if(!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if(k === "z"){ e.preventDefault(); go(e.shiftKey ? 1 : -1); }
    else if(k === "y"){ e.preventDefault(); go(1); }
  });
  const tools = el("div", { class: "ed-tools" }, [undoBtn, redoBtn]);
  const box = el("div", {}, [tools, wrap]);
  function paint(){
    clearTimeout(ht); ht = setTimeout(snap, 400);
    last = parseQuiz(ta.value);
    hl.innerHTML = highlightHtml(ta.value, allRanges(last));
    hl.scrollTop = ta.scrollTop;
    onParsed(last, ta.value);
  }
  // Nhảy tới đúng chỗ lỗi: cuộn khung, bôi đen đoạn lỗi
  function jump(pos, end){
    hl.innerHTML = highlightHtml(ta.value, allRanges(last), pos);
    const m = hl.querySelector("#jm");
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(pos, Math.max(end, pos));
    if(m){ ta.scrollTop = Math.max(0, m.offsetTop - 70); hl.scrollTop = ta.scrollTop; }
  }
  ta.addEventListener("input", paint);
  ta.addEventListener("scroll", () => { hl.scrollTop = ta.scrollTop; });
  return { wrap: box, ta, paint, jump };
}

    if(!list.length) return;
    const errN = list.filter(i => i.level === "err").length;
    issuesBox.appendChild(el("div", { class: "issues-title" }, `${errN} lỗi · ${list.length - errN} cảnh báo — bấm vào để nhảy tới chỗ cần sửa`));
    list.slice(0, 60).forEach(is => {
      issuesBox.appendChild(el("button", {
        class: "issue " + (is.level === "err" ? "e" : "w"),
        onclick: () => editor.jump(is.s, is.e)
      }, (is.level === "err" ? "" : "") + is.msg));
    });
    if(list.length > 60) issuesBox.appendChild(el("div", { class: "hint" }, `… và ${list.length - 60} mục nữa`));
  }

  function updateStatus(){
    const qs = lastRes.questions;
    if(!qs.length){
      status.textContent = editor.ta.value.trim()
        ? "Chưa nhận diện được câu nào — thử đánh số “Câu 1.” và nhãn A. B. C. D."
        : "Dán nội dung đề vào khung trên, mình sẽ tự nhận diện và tô đỏ.";
      return;
    }
    const noKey = qs.filter(q => !q.hasMarker).length;
    status.textContent = `Đã nhận diện ${qs.length} câu` + (qs.some(q => q.tf) ? ` (${qs.filter(q => q.tf).length} câu Đúng/Sai)` : "") +
      (qs.some(q => q.sa) ? ` (${qs.filter(q => q.sa).length} câu Trả lời ngắn)` : "") +
      (noKey ? ` — ${noKey} câu chưa đánh dấu đáp án đúng (mặc định chọn đáp án đầu).` : " — câu nào cũng có đáp án đúng ");
  }

  editor = buildEditor(state.draftText, (res, txt) => {
    lastRes = res;
    state.draftText = txt;
    updateStatus();
    fillIssues(res.issues);
    fillPreview(pvBody, res.questions);
    summary.textContent = `Xem danh sách câu đã nhận diện (${res.questions.length})`;
  });
  ed.appendChild(editor.wrap);
  ed.appendChild(el("div", { class: "hint legend" }, [
    "Chú thích: ", el("span", { class: "hq" }, "Câu 1."), " ",
    el("span", { class: "ho0" }, "A."), " ", el("span", { class: "ho1" }, "B."), " ", el("span", { class: "ho2" }, "C."), " ", el("span", { class: "ho3" }, "D."),
    " = đã nhận diện · ", el("span", { class: "hk" }, "⭐"), " = đáp án đúng · ", el("span", { class: "ierr" }, "gạch lượn sóng"), " = chỗ có vấn đề"
  ]));
  ed.appendChild(status);
  ed.appendChild(issuesBox);
  ed.appendChild(details);

  const fileRow = el("div", { class: "row" });
  const fileInput = el("input", { type: "file", accept: ".docx,.pdf,.txt,.md,.odt,.html,.htm,.zip", style: "display:none;" });
  fileInput.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      toast("Đang đọc file…");
      const r = await readAnyFile(file);
      editor.ta.value = r.text;
      state.draftImages = r.images;
      if(!nameIn.value.trim()){ nameIn.value = file.name.replace(/\.[^.]+$/, ""); state.draftName = nameIn.value; }
      editor.paint();
      const nImg = Object.values(r.images).filter(Boolean).length;
      toast(`Đã đọc file — ${lastRes.questions.length} câu` + (nImg ? `, ${nImg} hình ảnh` : "") + (r.skipped ? ` (${r.skipped} hình định dạng EMF/WMF không hỗ trợ)` : ""));
    }catch(err){
      console.error(err);
      toast(fileErrorMsg(err));
    }finally{
      e.target.value = "";
    }
  });
  fileRow.appendChild(el("label", { class: "file-label" }, ["Tải file đề (Word, PDF…)", fileInput]));
  fileRow.appendChild(el("button", {
    class: "secondary",
    onclick: async () => {
      if(!lastRes.questions.length){ toast("Chưa có câu hỏi để xuất."); return; }
      try{
        const blob = await buildDocxBlob(lastRes.questions);
        const downloads = window.claude ? await window.claude.use("downloads") : null;
        if(downloads) await downloads.save({ filename: "trac-nghiem.docx", data: blob });
        else toast("Không thể lưu file trực tiếp ở đây.");
      }catch(err){
        if(err && err.code === "declined") return;
        console.error(err);
        toast("Xuất file thất bại.");
      }
    }
  }, "Xuất file Word"));
  fileRow.appendChild(el("button", { class: "secondary", onclick: () => openQuestionBuilder(
    () => lastRes.questions.length + 1,
    (block) => { const cur = editor.ta.value.replace(/\s+$/, ""); editor.ta.value = (cur ? cur + "\n\n" : "") + block; editor.paint(); editor.ta.scrollTop = editor.ta.scrollHeight; }
  ) }, "Thêm câu hỏi"));
  ed.appendChild(fileRow);
  ed.appendChild(el("div", { class: "hint", style: "margin-top:6px;" }, "Hỗ trợ Word, PDF, TXT, ODT, HTML. Với Google Docs: vào Tệp → Tải xuống → chọn Word (.docx) hoặc PDF rồi tải lên đây; hoặc bôi đen copy nội dung rồi dán vào ô soạn đề."));

  const start = (mode) => {
    if(!lastRes.questions.length){ toast("Chưa có câu hỏi nào được nhận diện."); return; }
    launchWithCheck(lastRes, mode, state.draftName.trim() || "Đề nháp", null, () => {
      const f = firstIssue(lastRes.issues);
      ed.scrollIntoView({ behavior: "smooth", block: "start" });
      if(f) setTimeout(() => editor.jump(f.s, f.e), 350);
    });
  };
  const actions = el("div", { class: "row" });
  actions.appendChild(el("button", {
    onclick: () => {
      if(!lastRes.questions.length){ toast("Chưa có câu hỏi nào để lưu."); return; }
      const name = state.draftName.trim() || `Đề ${state.sets.length + 1}`;
      if(state.editingId){
        const s = state.sets.find(x => x.id === state.editingId);
        if(s){ s.name = name; s.text = state.draftText; s.images = pruneImages(state.draftImages, state.draftText); }
        else state.sets.push({ id: uid(), name, text: state.draftText, images: pruneImages(state.draftImages, state.draftText) });
      } else {
        state.sets.push({ id: uid(), name, text: state.draftText, images: pruneImages(state.draftImages, state.draftText) });
      }
      persistSets();
      state.editingId = null; state.draftName = ""; state.draftText = ""; state.draftImages = {};
      toast("Đã lưu đề ");
      render();
    }
  }, state.editingId ? "Lưu thay đổi" : "Lưu thành đề"));
  if(state.editingId || state.draftText){
    actions.appendChild(el("button", { class: "secondary", onclick: () => {
      state.editingId = null; state.draftName = ""; state.draftText = ""; state.draftImages = {}; render();
    } }, state.editingId ? "Huỷ sửa" : "Xoá khung"));
  }
  ed.appendChild(actions);
  c.appendChild(ed);

  editor.paint();
  if(state.pendingJump){
    state.pendingJump = false;
    const f = firstIssue(lastRes.issues);
    setTimeout(() => {
      ed.scrollIntoView({ behavior: "smooth", block: "start" });
      if(f) setTimeout(() => editor.jump(f.s, f.e), 350);
    }, 60);
  }

  c.appendChild(renderLeaderboardCard(5));
  return c;
}

function openEditor(setObj){
  state.editingId = setObj.id;
  state.draftName = setObj.name;
  state.draftText = setObj.text;
  state.draftImages = Object.assign({}, setObj.images || {});
  state.pendingJump = true;
  state.screen = "home";
  render();
}

function launch(res, mode, name){
  state.questions = res.questions;
  state.mode = mode;
  state.setName = name;
  beginQuiz();
}

// Kiểm tra đề trước khi làm: nếu thiếu câu / thiếu đáp án / thiếu đáp án đúng → cảnh báo, cho chọn sửa hoặc vẫn làm
function launchWithCheck(res, mode, name, setObj, onFix){
  state.images = (setObj ? setObj.images : state.draftImages) || {};
  if(!res.questions.length){ toast("Chưa nhận diện được câu hỏi nào — kiểm tra lại nội dung đề nhé."); return; }
  if(!res.issues.length || (setObj && setObj.ignoreIssues)){ launch(res, mode, name); return; }
  showIssuesDialog(res, setObj, {
    onContinue: () => launch(res, mode, name),
    onFix: onFix || (() => openEditor(setObj))
  });
}

function startFromText(text, mode, name, setObj){
  launchWithCheck(parseQuiz(text), mode, name, setObj);
}

function showIssuesDialog(res, setObj, cb){
  const bg = el("div", { class: "modal-bg" });
  const box = el("div", { class: "modal" });
  const errN = res.issues.filter(i => i.level === "err").length;
  const warnN = res.issues.length - errN;
  box.appendChild(el("div", { class: "q-text" }, "Đề này có chỗ chưa ổn"));
  box.appendChild(el("div", { class: "hint", style: "margin-bottom:8px;" },
    `${errN} lỗi · ${warnN} cảnh báo. Làm luôn thì câu lỗi có thể thiếu đáp án để chọn hoặc chấm sai.`));
  const list = el("div", { class: "modal-list" });
  res.issues.slice(0, 6).forEach(is => list.appendChild(el("div", { class: "modal-item" }, (is.level === "err" ? "" : "") + is.msg)));
  if(res.issues.length > 6) list.appendChild(el("div", { class: "hint" }, `… và ${res.issues.length - 6} mục nữa (xem đầy đủ trong khung sửa đề)`));
  box.appendChild(list);
  let ignore = null;
  if(setObj){
    ignore = el("input", { type: "checkbox" });
    box.appendChild(el("label", { class: "toggle-row" }, [ignore, el("span", {}, "Không hỏi lại cho đề này")]));
  }
  const close = () => bg.remove();
  const row = el("div", { class: "row" });
  row.appendChild(el("button", { onclick: () => { close(); cb.onFix(); } }, "Sửa đề (nhảy tới chỗ lỗi)"));
  row.appendChild(el("button", { class: "secondary", onclick: () => {
    if(ignore && ignore.checked){ setObj.ignoreIssues = true; persistSets(); }
    close(); cb.onContinue();
  } }, "Vẫn làm bài"));
  box.appendChild(row);
  bg.appendChild(box);
  document.body.appendChild(bg);
}

function beginQuiz(){
  let qs = state.questions.map(q => ({ q: q.q, opts: q.opts.slice(), correct: q.correct, tf: !!q.tf, truth: q.truth ? q.truth.slice() : null, sa: !!q.sa, ans: q.ans ? q.ans.slice() : null }));
  if(state.shuffle){
    qs = shuffleArray(qs);
    qs = qs.map(q => {
      const idxs = shuffleArray(q.opts.map((_, i) => i));
      // Câu Đúng/Sai: đảo luôn vị trí các ý a b c d (nhãn tự đánh lại theo thứ tự mới)
      if(q.sa) return { q: q.q, opts: [], sa: true, ans: q.ans, correct: 0, hasMarker: true };
      if(q.tf) return { q: q.q, opts: idxs.map(i => q.opts[i]), tf: true, truth: idxs.map(i => q.truth[i]), correct: 0, hasMarker: true };
      return { q: q.q, opts: idxs.map(i => q.opts[i]), correct: idxs.indexOf(q.correct) };
    });
  }
  state.quizQuestions = qs;
  state.answers = qs.map(q => q.sa ? "" : (q.tf ? new Array(q.opts.length).fill(null) : null));
  state.saChecked = {};
  state.current = 0;
  state.startTime = Date.now();
  state.elapsedSeconds = 0;
  state.limitSec = state.mode === "thi" ? state.limitMin * 60 : 0;
  state.screen = "quiz";
  startTimer();
  render();
  window.scrollTo(0, 0);
}

function finishQuiz(force){
  if(state.mode === "thi" && force !== true){
    const unanswered = state.answers.filter((a, i) => !qDone(i)).length;
    if(unanswered > 0){
      toast(`Còn ${unanswered} câu chưa trả lời — chế độ Thi phải làm hết mới nộp được.`);
      return;
    }
  }
  stopTimer();
  const total = state.quizQuestions.length;
  let correct = 0;
  state.quizQuestions.forEach((q, i) => { if(isCorrect(q, state.answers[i])) correct++; });
  state.elapsedSeconds = Math.floor((Date.now() - state.startTime) / 1000);
  state.resultFilter = "all";
  saveAttempt({ correct, total, seconds: state.elapsedSeconds, mode: state.mode, name: state.setName, player: state.playerName });
  state.screen = "result";
  render();
  window.scrollTo(0, 0);
}

function renderQuiz(){
  const container = el("div");
  const total = state.quizQuestions.length;
  const i = state.current;
  const q = state.quizQuestions[i];
  const isExam = state.mode === "thi";
  const answeredCount = state.answers.filter((a, i) => qDone(i)).length;

  const top = el("div", { class: "top-actions" });
  top.appendChild(el("a", { class: "link-btn", onclick: () => { stopTimer(); state.screen = "home"; render(); } }, "← Thoát"));
  const mid = el("div", { class: "quiz-reactor-wrap" });
  mid.appendChild(makeReactor("sm calm"));
  mid.appendChild(el("span", { class: "timer-badge" }, ["", el("span", { id: "quiz-timer" }, timerText())]));
  top.appendChild(mid);
  container.appendChild(top);

  const progress = el("div", { class: "progress" });
  const bar = el("div"); bar.style.width = Math.round((answeredCount / total) * 100) + "%";
  progress.appendChild(bar);
  container.appendChild(progress);

  const card = el("div", { class: "card" });
  card.appendChild(el("div", { class: "q-num" }, `${state.setName} · Câu ${i + 1}/${total} · ${isExam ? "Thi" : "Ôn tập"}`));
  card.appendChild(qTypePill(q));
  card.appendChild(el("div", { class: "q-text" }, richNodes(q.q, state.images, "q-img")));

  const reveal = !isExam && state.answers[i] != null;
  if(q.sa) renderSaQuiz(card, q, i, isExam);
  else if(q.tf) renderTfQuiz(card, q, i, isExam);
  else q.opts.forEach((opt, oi) => {
    let cls = "opt";
    if(reveal){
      if(oi === q.correct) cls += " correct";
      else if(oi === state.answers[i]) cls += " wrong";
    } else if(oi === state.answers[i]){
      cls += " selected";
    }
    const btn = el("button", { class: cls }, optContent(oi, opt));
    if(!reveal) btn.addEventListener("click", () => { state.answers[i] = oi; render(); });
    card.appendChild(btn);
  });
  container.appendChild(card);

  const nav = el("div", { class: "row" });
  const prevBtn = el("button", { class: "secondary", onclick: () => { if(i > 0){ state.current = i - 1; render(); } } }, "← Câu trước");
  if(i === 0) prevBtn.disabled = true;
  nav.appendChild(prevBtn);
  if(i < total - 1) nav.appendChild(el("button", { onclick: () => { state.current = i + 1; render(); } }, "Câu sau →"));
  nav.appendChild(el("button", { class: "secondary", onclick: finishQuiz }, "Nộp bài "));
  container.appendChild(nav);

  const grid = el("div", { class: "nav-grid" });
  state.quizQuestions.forEach((_, qi) => {
    let cls = "nav-dot";
    if(qi === i) cls += " current";
    if(qDone(qi)) cls += " answered";
    grid.appendChild(el("button", { class: cls, onclick: () => { state.current = qi; render(); } }, String(qi + 1)));
  });
  container.appendChild(grid);

  return container;
}

function renderResult(){
  const container = el("div");
  const total = state.quizQuestions.length;
  let correct = 0;
  state.quizQuestions.forEach((q, i) => { if(isCorrect(q, state.answers[i])) correct++; });
  const wrong = total - correct;
  const pct = Math.round((correct / total) * 100);

  const resultHead = el("div", { class: "logo-row", style: "margin-bottom:8px;" });
  resultHead.appendChild(makeReactor("sm"));
  resultHead.appendChild(el("h1", { class: "logo-title" }, `Kết quả — ${state.setName}`));
  container.appendChild(resultHead);

  const summary = el("div", { class: "card" });
  summary.appendChild(el("div", { class: "score" }, `${correct}/${total}`));
  summary.appendChild(el("div", { class: "sub", style: "text-align:center" },
    `Đúng ${pct}% · Sai ${wrong} câu · Thời gian ${formatTime(state.elapsedSeconds)}`));
  container.appendChild(summary);

  container.appendChild(renderLeaderboardCard(5));

  const filterRow = el("div", { class: "row" });
  [["all", `Tất cả (${total})`], ["correct", `Đúng (${correct})`], ["wrong", `Sai (${wrong})`]].forEach(([key, label]) => {
    filterRow.appendChild(el("button", {
      class: state.resultFilter === key ? "" : "secondary",
      onclick: () => { state.resultFilter = key; render(); }
    }, label));
  });
  container.appendChild(filterRow);

  // Chú thích màu — dễ hiểu
  container.appendChild(el("div", { class: "result-legend" }, [
    el("span", {}, [el("span", { class: "lg-dot ok" }), " Xanh lá = bạn chọn đúng"]),
    el("span", {}, [el("span", { class: "lg-dot bad" }), " Đỏ = bạn chọn sai"]),
    el("span", {}, [el("span", { class: "lg-dot key" }), " Viền nét đứt = đáp án đúng"]),
  ]));

  state.quizQuestions.forEach((q, i) => {
    const ok = isCorrect(q, state.answers[i]);
    if(state.resultFilter === "correct" && !ok) return;
    if(state.resultFilter === "wrong" && ok) return;
    const c = el("div", { class: "card" });
    c.appendChild(el("div", {
      class: "result-badge " + (ok ? "ok" : "bad")
    }, ok ? "Câu " + (i + 1) + " — ĐÚNG" : "Câu " + (i + 1) + " — SAI"));
    c.appendChild(qTypePill(q));
    c.appendChild(el("div", { class: "q-text" }, richNodes(q.q, state.images, "q-img")));
    if(q.sa){ renderSaResult(c, q, state.answers[i], ok); container.appendChild(c); return; }
    if(q.tf){ renderTfResult(c, q, state.answers[i]); container.appendChild(c); return; }

    const letter = (oi) => "ABCD"[oi] || String(oi + 1);

    if(ok){
      // Chỉ hiện đáp án đúng (xanh) — gọn, dễ nhìn
      c.appendChild(el("button", { class: "opt correct", disabled: "disabled" }, [
        ...optContent(q.correct, q.opts[q.correct]),
        el("span", { class: "opt-tag tag-ok" }, "✓ Đáp án đúng")
      ]));
    } else {
      // 2 dòng so sánh to, rõ: bạn chọn (đỏ) + đáp án đúng (vàng)
      const compare = el("div", { class: "result-compare" });
      const yourTxt = state.answers[i] == null
        ? "Chưa chọn đáp án"
        : (letter(state.answers[i]) + ". " + (q.opts[state.answers[i]] || "(trống)"));
      compare.appendChild(el("div", { class: "rc-row" }, [
        el("span", { class: "rc-label bad" }, "BẠN CHỌN"),
        el("span", { class: "rc-text", style: "color:var(--bad);" }, state.answers[i] == null ? yourTxt : [letter(state.answers[i]) + ". ", ...richNodes(q.opts[state.answers[i]] || "(trống)", state.images, "opt-img")])
      ]));
      compare.appendChild(el("div", { class: "rc-row" }, [
        el("span", { class: "rc-label key" }, "ĐÁP ÁN ĐÚNG"),
        el("span", { class: "rc-text", style: "color:var(--ok);" },
          [letter(q.correct) + ". ", ...richNodes(q.opts[q.correct] || "(trống)", state.images, "opt-img")])
      ]));
      c.appendChild(compare);

      if(state.answers[i] != null){
        c.appendChild(el("button", { class: "opt wrong", disabled: "disabled" }, [
          ...optContent(state.answers[i], q.opts[state.answers[i]]),
          el("span", { class: "opt-tag tag-bad" }, "✗ Bạn chọn sai")
        ]));
      }
      c.appendChild(el("button", { class: "opt key", disabled: "disabled" }, [
        ...optContent(q.correct, q.opts[q.correct]),
        el("span", { class: "opt-tag tag-key" }, "✓ Đáp án đúng")
      ]));
    }
    container.appendChild(c);
  });

  const row = el("div", { class: "row" });
  row.appendChild(el("button", { onclick: beginQuiz }, "Làm lại"));
  row.appendChild(el("button", { class: "secondary", onclick: async () => {
    const txt = `${state.playerName.trim() || "Ẩn danh"} — ${state.setName} (${state.mode === "thi" ? "Thi" : "Ôn tập"}): ${correct}/${total} câu đúng (${pct}%), thời gian ${formatTime(state.elapsedSeconds)}`;
    const ok = await copyText(txt);
    toast(ok ? "Đã sao chép kết quả — dán gửi cho người ra đề " : txt);
  } }, "Sao chép kết quả"));
  row.appendChild(el("button", { class: "secondary", onclick: () => { state.screen = "home"; render(); } }, "Về trang đề"));
  container.appendChild(row);

  return container;
}

render();
</script>
<script>
(function(){
  const KEY="tracnghiem_bg_v3", IK="tracnghiem_bg_img_v2";
  const PRE=[["Vở ô ly","linear-gradient(#D3DCEA 1px,transparent 1px),linear-gradient(90deg,#D3DCEA 1px,transparent 1px),#F5F7FA","24px 24px,24px 24px,auto",0],["Vở kẻ ngang","linear-gradient(90deg,transparent 52px,#E3A3A3 52px,#E3A3A3 54px,transparent 54px),repeating-linear-gradient(#F6F8FB 0 27px,#D3DCEA 27px 28px)","auto",0],["Giấy trắng","#FAFBFC","auto",0],["Xám nhạt","#E8ECF2","auto",0],["Xanh nhạt","#E3ECF8","auto",0],["Xanh lá nhạt","#E3EFE6","auto",0],["Bảng xanh","#1F3B32","auto",1],["Đêm","#12161D","auto",1]];
  const DEF={p:0,fit:"cover",zoom:100,x:0,y:0,sx:100,sy:100,op:100,br:100,dk:0,bl:0,th:"auto"};
  let S=Object.assign({},DEF), img="", imgLum=0.6;
  try{ Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}")); img=localStorage.getItem(IK)||""; }catch(e){}
  function lumOf(src){ const c=document.createElement("canvas"); c.width=c.height=24; const x=c.getContext("2d"); x.drawImage(src,0,0,24,24); const d=x.getImageData(0,0,24,24).data; let t=0; for(let i=0;i<d.length;i+=4) t+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2]; return t/(d.length/4)/255; }
  const bgl=document.createElement("div"); bgl.id="bgl"; bgl.innerHTML='<div class="bi"></div><div class="bo"></div>';

  function build(){
    panel.innerHTML='<div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:1.2rem">Cài đặt hình nền</b><button class="secondary sm" id="bgx">Xong ✓</button></div>'
